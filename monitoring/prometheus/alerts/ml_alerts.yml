groups:
- name: ml_monitoring
  rules:
  - alert: ModerateFeatureDrift
    expr: ml_drift_score > 0.10
    for: 15m
    labels:
      severity: warning
      signal: leading
    annotations:
      summary: Input drift in the moderate band (PSI {{ $value | printf "%.3f" }})
      description: The applicants arriving no longer match the training population. The model is
        not broken and its outputs are still well-formed; this is the earliest signal available,
        weeks before any accuracy number could arrive. Check ml_feature_drift_psi by feature to see
        which one moved, and whether it moved for a reason you already know about (a new marketing
        channel, a seasonal effect).
  - alert: SignificantFeatureDrift
    expr: ml_drift_score > 0.25
    for: 15m
    labels:
      severity: critical
      signal: leading
    annotations:
      summary: Input drift is significant (PSI {{ $value | printf "%.3f" }})
      description: 'Retraining is likely warranted. Before triggering it, confirm the drift is real
        and not an artefact: a single upstream system sending a default value for a field produces
        exactly this signature and is fixed in the pipeline, not in the model.'
  - alert: DriftWindowTooSmall
    expr: ml_drift_window_size < 200
    for: 30m
    labels:
      severity: info
    annotations:
      summary: Drift window has fewer than 200 requests
      description: Not a model problem — a statistics problem. The drift number reported below this
        size is noise, and the service reports it as insufficient rather than as zero. This alert
        exists so that "drift is fine" is never inferred from "drift is not being measured".
  - alert: FairnessGapWidened
    expr: ml_fairness_gap > 0.10
    for: 20m
    labels:
      severity: critical
      signal: fairness
    annotations:
      summary: Selection-rate gap between groups is {{ $value | printf "%.3f" }}
      description: One group is being sent to review or decline at a materially different rate than
        another. Aggregate drift and aggregate score metrics can both look healthy while this fires
        — that is the point of measuring it separately. Confirm against ml_selection_rate by group
        before acting; a gap that reflects a real change in who is applying is a different problem
        from a gap the model introduced.
  - alert: DecisionMixShift
    expr: sum(rate(ml_decisions_total{decision="DECLINE"}[30m])) / sum(rate(ml_decisions_total[30m]))
      > 0.20
    for: 30m
    labels:
      severity: warning
    annotations:
      summary: Decline share exceeds 20%
      description: Compare decision rates with the baseline and inspect feature drift. Confirm whether
        a changed applicant population explains the additional declines.
  - alert: PredictionErrorsRising
    expr: sum(rate(ml_prediction_errors_total[5m])) > 0.1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Model failures exceed 0.1 per second
      description: Inspect ml_prediction_errors_total by error_type and service logs. Check the model
        artifact and input transformation before rolling back.
  - alert: ExplanationLatencyHigh
    expr: histogram_quantile(0.95, sum(rate(ml_explain_duration_seconds_bucket[5m])) by (le)) > 1
    for: 10m
    labels:
      severity: warning
    annotations:
      summary: Explanation p95 exceeds one second
      description: Check SHAP computation time separately from scoring latency. Investigate CPU contention
        and explanation request volume before scaling the service.
